<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — VoyageCraft</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background-color: var(--warm-sand-light);">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-compass-fill"></i> VoyageCraft
            </a>
            <div>
                <a th:href="@{/register}" class="btn btn-outline-forest btn-sm">Register</a>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-modern p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="metric-icon forest mx-auto mb-3">
                            <i class="bi bi-person-lock"></i>
                        </div>
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p class="text-muted small">Sign in to manage and customize your personalized travel itineraries</p>
                    </div>

                    <!-- Flash messages -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="username" name="username" class="form-control" placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-forest w-100 py-2 mb-3">
                            Sign In
                        </button>

                        <!-- Quick Demo Credentials Filler -->
                        <div class="p-3 rounded-3 text-center mb-3" style="background: var(--warm-sand); border: 1px solid var(--border-color);">
                            <div class="small text-muted fw-semibold mb-1">Quick Evaluation Account:</div>
                            <button type="button" class="btn btn-sm btn-sand px-3" onclick="fillDemoUser()">
                                <i class="bi bi-lightning-charge me-1 text-warning"></i> Fill Demo Credentials
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted small">Don't have an account? </span>
                        <a th:href="@{/register}" class="fw-semibold text-dark small">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-0 text-muted small">VoyageCraft &bull; Every journey, thoughtfully planned.</p>
        </div>
    </footer>

    <script>
        function fillDemoUser() {
            document.getElementById('username').value = 'traveler@example.com';
            document.getElementById('password').value = 'travel123';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
