# =========================================================
# VoyageCraft - Production Application Configuration
# Profile: prod
# =========================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# MySQL Production Datasource
# Support cloud JDBC URLs directly (e.g. Clever Cloud, Railway, PlanetScale, AWS RDS)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trip_planner}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Enterprise Connection Pooling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:4}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=VoyageCraftHikariPool

# JPA / Hibernate Production Settings (Never drop or alter tables in production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Thymeleaf Template Caching (Enabled for production performance)
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# External API Integrations (Environment-based)
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.enabled=${GOOGLE_MAPS_ENABLED:true}
ai.service.api-key=${AI_API_KEY:}

# SmartStops Overpass integration
smartstops.overpass.enabled=${SMARTSTOPS_OVERPASS_ENABLED:true}

# Production Logging (Sanitized, no stack traces leaked)
logging.level.root=INFO
logging.level.com.example.tripplanner=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
