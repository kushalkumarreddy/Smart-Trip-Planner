<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18392F" />
      <stop offset="60%" stop-color="#244F40" />
      <stop offset="100%" stop-color="#DCE8DC" />
    </linearGradient>
    <linearGradient id="mountainGradFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#345e50" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#18392F" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="mountainGradNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#244F40" />
      <stop offset="100%" stop-color="#132c24" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4B5" />
      <stop offset="100%" stop-color="#D8A86E" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D8A86E" />
      <stop offset="100%" stop-color="#68756D" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)" />

  <!-- Rising Sun -->
  <circle cx="400" cy="220" r="85" fill="url(#sunGlow)" opacity="0.85" />
  <circle cx="400" cy="220" r="110" fill="none" stroke="#D8A86E" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Distant Birds -->
  <path d="M 220 120 Q 230 110 240 120 Q 250 110 260 120" fill="none" stroke="#F7F3EA" stroke-width="2" opacity="0.6"/>
  <path d="M 520 140 Q 530 130 540 140 Q 550 130 560 140" fill="none" stroke="#F7F3EA" stroke-width="2" opacity="0.6"/>
  <path d="M 270 145 Q 278 137 286 145 Q 294 137 302 145" fill="none" stroke="#F7F3EA" stroke-width="1.5" opacity="0.5"/>

  <!-- Distant Mountains -->
  <polygon points="-50,380 180,210 390,380" fill="url(#mountainGradFar)" />
  <polygon points="260,390 470,190 680,390" fill="url(#mountainGradFar)" />
  <polygon points="510,400 680,240 860,400" fill="url(#mountainGradFar)" />

  <!-- Fore Mountains & Hills -->
  <polygon points="-20,440 120,290 320,440" fill="url(#mountainGradNear)" />
  <polygon points="210,460 380,270 560,460" fill="url(#mountainGradNear)" />
  <polygon points="460,450 630,290 820,450" fill="url(#mountainGradNear)" />

  <!-- Scenic Road -->
  <path d="M 370 330 Q 395 380 340 440 Q 300 480 260 500 L 540 500 Q 500 470 450 420 Q 425 370 410 330 Z" fill="url(#roadGrad)" />
  <!-- Center Road Dashes -->
  <path d="M 390 338 L 388 355 M 383 375 L 380 400 M 372 425 L 366 455 M 358 475 L 350 500" stroke="#F7F3EA" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Foreground Trees Silhouettes -->
  <polygon points="40,500 65,420 90,500" fill="#18392F" />
  <polygon points="75,500 95,440 115,500" fill="#132c24" />
  <polygon points="690,500 715,410 740,500" fill="#18392F" />
  <polygon points="725,500 745,435 765,500" fill="#132c24" />

  <!-- Compass / Brand Watermark Overlay -->
  <g transform="translate(400, 110)" opacity="0.3">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#F7F3EA" stroke-width="2" />
    <polygon points="0,-26 5,0 0,5 -5,0" fill="#D8A86E" />
    <polygon points="0,26 5,0 0,-5 -5,0" fill="#F7F3EA" />
  </g>
</svg>
