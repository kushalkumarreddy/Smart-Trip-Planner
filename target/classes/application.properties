# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/trip_planner?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Google Maps Platform Configuration
# Add your Google Maps API key here or set GOOGLE_MAPS_API_KEY environment variable.
# Required APIs in Google Cloud Console:
# 1. Maps JavaScript API
# 2. Places API (New) / Places API
# 3. Directions API
# 4. Distance Matrix API
# 5. Geocoding API
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
# If true and a valid key is provided, calls to Google Directions & Places APIs will be made live.
# If empty or false, the app automatically uses realistic built-in route calculations and sightseeing places.
google.maps.enabled=true

# Trip Planner defaults
tripplanner.default.buffer-minutes=20
tripplanner.default.lunch-start=12:30
tripplanner.default.lunch-duration-minutes=60
tripplanner.default.dinner-start=19:30
tripplanner.default.dinner-duration-minutes=60
