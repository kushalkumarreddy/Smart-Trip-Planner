<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18392F" />
      <stop offset="40%" stop-color="#244F40" />
      <stop offset="85%" stop-color="#1b4235" />
      <stop offset="100%" stop-color="#132c24" />
    </linearGradient>
    <linearGradient id="heroHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d614f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#18392F" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="sunSpot" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#D8A86E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#18392F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1920" height="800" fill="url(#heroGradient)" />
  <rect width="1920" height="800" fill="url(#sunSpot)" />

  <!-- Mountain layers -->
  <path d="M 0 550 Q 300 320 600 480 Q 950 280 1300 450 Q 1650 310 1920 520 L 1920 800 L 0 800 Z" fill="url(#heroHills)" />
  <path d="M 0 620 Q 350 430 750 560 Q 1150 410 1550 580 Q 1750 510 1920 630 L 1920 800 L 0 800 Z" fill="#18392F" opacity="0.8" />
  <path d="M 0 710 Q 400 580 900 670 Q 1400 560 1920 700 L 1920 800 L 0 800 Z" fill="#132c24" />

  <!-- Subtly etched contour waves -->
  <path d="M 0 350 C 400 300 800 400 1200 320 C 1600 240 1800 360 1920 300" stroke="#D8A86E" stroke-width="1.5" fill="none" opacity="0.15" />
  <path d="M 0 420 C 500 380 900 480 1300 410 C 1700 340 1850 430 1920 380" stroke="#DCE8DC" stroke-width="1" fill="none" opacity="0.12" />
  <path d="M 0 490 C 450 450 850 540 1250 480 C 1650 420 1820 500 1920 460" stroke="#DCE8DC" stroke-width="1" fill="none" opacity="0.08" />
</svg>
