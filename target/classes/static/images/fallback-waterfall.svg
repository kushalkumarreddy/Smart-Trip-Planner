<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gorgeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18392F" />
      <stop offset="100%" stop-color="#244F40" />
    </linearGradient>
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCE8DC" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a8d5c8" />
    </linearGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18392F" />
      <stop offset="100%" stop-color="#0f241d" />
    </linearGradient>
  </defs>

  <!-- Forest Canopy Top -->
  <rect width="800" height="500" fill="url(#gorgeSky)" />

  <!-- Left Canyon Cliff -->
  <path d="M 0 0 L 330 0 L 310 160 L 340 280 L 290 420 L 0 500 Z" fill="url(#rockGrad)" />
  <!-- Right Canyon Cliff -->
  <path d="M 800 0 L 470 0 L 490 140 L 460 260 L 510 430 L 800 500 Z" fill="url(#rockGrad)" />

  <!-- Cascading Water Stream -->
  <path d="M 330 0 L 470 0 L 440 180 L 460 380 L 520 480 L 280 480 L 340 380 L 360 180 Z" fill="url(#waterFlow)" />

  <!-- Cascade Flow Lines -->
  <path d="M 370 0 L 380 200 L 360 380 L 340 480" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <path d="M 400 0 L 400 220 L 400 390 L 400 480" stroke="#ffffff" stroke-width="6" opacity="0.9" />
  <path d="M 430 0 L 420 200 L 440 380 L 460 480" stroke="#ffffff" stroke-width="4" opacity="0.8" />

  <!-- Plunge Pool Water Spray / Mist -->
  <ellipse cx="400" cy="460" rx="190" ry="40" fill="#ffffff" opacity="0.5" />
  <ellipse cx="400" cy="480" rx="250" ry="30" fill="#a8d5c8" opacity="0.6" />

  <!-- Overhanging Jungle Vines -->
  <path d="M 120 0 Q 150 90 130 160 Q 110 200 135 240" stroke="#2d6a50" stroke-width="4" fill="none" />
  <path d="M 220 0 Q 240 70 215 130" stroke="#2d6a50" stroke-width="3" fill="none" />
  <path d="M 680 0 Q 660 80 690 150 Q 710 210 680 270" stroke="#2d6a50" stroke-width="4" fill="none" />
</svg>
